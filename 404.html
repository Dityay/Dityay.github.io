    <meta name="theme-color" content="#090a0f" id="meta-theme-color" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="assets/css/style-components.css?v=33" />
</head>
<body>

    <!-- Ambient Silk Ribbons & Orbs -->
    <canvas id="ribbon-canvas" aria-hidden="true"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="app" style="display: flex; flex-direction: column; min-height: 100vh;">
        <!-- Sticky Navigation -->
        <nav>
            <a href="index.html" class="nav-brand" style="text-decoration: none;">
                <div class="nav-logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <!-- Android Robot Antennae -->
                        <line x1="8.5" y1="3" x2="6.8" y2="1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <line x1="15.5" y1="3" x2="17.2" y2="1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <!-- Android Robot Head Dome -->
                        <path d="M6 7.5c0-3.31 2.69-6 6-6s6 2.69 6 6H6z" fill="currentColor"/>
                        <!-- Android Robot Eyes -->
                        <circle cx="9.5" cy="4.8" r="0.9" fill="var(--accent)"/>
                        <circle cx="14.5" cy="4.8" r="0.9" fill="var(--accent)"/>
                        <!-- Android Robot Body & Limbs -->
                        <rect x="6" y="8.5" width="12" height="9.5" rx="0.5" fill="currentColor"/>
                        <rect x="2" y="8.5" width="2.6" height="8.5" rx="1.3" fill="currentColor"/>
                        <rect x="19.4" y="8.5" width="2.6" height="8.5" rx="1.3" fill="currentColor"/>
                        <rect x="8" y="17.5" width="2.6" height="5" rx="1.3" fill="currentColor"/>
                        <rect x="13.4" y="17.5" width="2.6" height="5" rx="1.3" fill="currentColor"/>
                    </svg>
                </div>
                <span class="nav-logo-text">Butterscotch</span>
            </a>
            <div class="nav-controls">
                <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle theme" title="Toggle Light / Dark mode">
                    <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="theme-icon-moon" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="https://telegram.me/dtyaa_ajh" target="_blank" rel="noopener noreferrer" class="btn-dl secondary nav-btn" style="text-decoration: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m20.665 3.717-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l-.313 4.674c.459 0 .66-.21.916-.459l2.199-2.138 4.573 3.379c.843.464 1.448.225 1.658-.783l3-14.143c.307-1.23-.467-1.786-1.509-1.336z"/>
                    </svg>
                    <span>Telegram</span>
                </a>
            </div>
        </nav>

        <!-- 404 Hero Container -->
        <div class="page active" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 6%;">
            <div style="background: var(--surface-cards); border: 1px solid var(--border); border-radius: 36px; padding: 50px 30px; max-width: 580px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">
                <h1 style="font-family: 'Syne', sans-serif; font-size: 7rem; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 12px; letter-spacing: -3px;">404</h1>
                <h2 style="font-family: 'Syne', sans-serif; font-size: 2rem; color: var(--text); margin-bottom: 14px; letter-spacing: -0.5px;">Lost in the Bootloop?</h2>
                <p style="color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 35px;">
                    The ROM or destination you requested does not exist or has been relocated.
                </p>
                <a href="index.html" class="btn-dl primary" style="padding: 16px 36px; font-size: 1.05rem;">
                    Back to All ROMs
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-content">
                <div class="footer-logo">Butterscotch</div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <span class="separator">&bull;</span>
                    <a href="https://telegram.me/dtyaa_ajh" target="_blank" rel="noopener noreferrer">Telegram</a>
                </div>
                <p class="footer-disclaimer">
                    &copy; <span id="footer-year">2026</span> Butterscotch Project. All rights reserved.
                </p>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const footerYear = document.getElementById('footer-year');
            if (footerYear) footerYear.textContent = new Date().getFullYear();

            const html = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle-btn');
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            const metaThemeColor = document.getElementById('meta-theme-color');

            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                if (theme === 'light') {
                    if (sunIcon) sunIcon.style.display = 'none';
                    if (moonIcon) moonIcon.style.display = 'block';
                    if (metaThemeColor) metaThemeColor.setAttribute('content', '#fdfbf7');
                } else {
                    if (sunIcon) sunIcon.style.display = 'block';
                    if (moonIcon) moonIcon.style.display = 'none';
                    if (metaThemeColor) metaThemeColor.setAttribute('content', '#14120e');
                }
            }

            const savedTheme = localStorage.getItem('butterscotch-theme');
            if (savedTheme) {
                applyTheme(savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const currentTheme = html.getAttribute('data-theme') || 'dark';
                    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('butterscotch-theme', nextTheme);
                    applyTheme(nextTheme);
                });
            }
        });
    </script>
    <script src="assets/js/ribbons.js?v=33"></script>
</body>
</html>
